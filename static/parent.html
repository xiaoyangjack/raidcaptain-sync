<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>锐察队长 · 家长指挥台</title>
<style>
  /* GBA 像素风 */
  :root{
    --bg:#0c1a0e; --panel:#16301a; --panel2:#1d3a21; --line:#2f5232;
    --ink:#e9f5d0; --sub:#9dbf7e; --light:#8bac0f; --gold:#f2c14e; --red:#e05b4b;
    --blue:#4fc3f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--ink);
       font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
       font-size:15px; line-height:1.5}
  .wrap{max-width:560px; margin:0 auto; padding:62px 14px 90px}

  /* 顶栏（登录后显示） */
  .topbar{position:fixed; top:0; left:0; right:0; background:var(--panel);
          border-bottom:1px solid var(--line); padding:8px 14px;
          display:none; align-items:center; gap:8px; z-index:10;
          max-width:560px; margin:0 auto}
  .topbar h1{font-size:16px; margin:0; flex:1}
  .fam-chip{font-size:11px; color:var(--sub); background:var(--panel2);
            padding:2px 7px; border-radius:6px; border:1px solid var(--line)}
  .dev-chip{font-size:11px; color:var(--sub); display:flex; align-items:center; gap:4px}
  .dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:#666}
  .dot.on{background:var(--light); box-shadow:0 0 5px var(--light)}

  /* 概览统计 */
  .stats{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:10px}
  .stat{background:var(--panel); border:1px solid var(--line); border-radius:8px;
        padding:8px; text-align:center}
  .stat .v{font-size:20px; font-weight:700; line-height:1.1}
  .stat .l{font-size:10px; color:var(--sub); margin-top:2px; letter-spacing:1px}
  .stat.warn .v{color:var(--gold)}
  .stat.bad .v{color:var(--red)}
  .stat.ok .v{color:var(--light)}

  /* 卡片 */
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px;
        padding:10px; margin-top:8px}
  .card-title{display:flex; align-items:center; gap:6px; font-weight:700;
              font-size:15px; margin-bottom:8px}
  .card-title .sp{flex:1}
  .card-title .act{font-size:13px; color:var(--light); cursor:pointer}

  /* 任务卡 */
  .task{background:var(--panel2); border:1px solid var(--line); border-radius:8px;
        padding:10px; margin-top:6px; position:relative; display:flex; gap:10px}
  .task-time{flex-shrink:0; background:var(--panel); border:1px solid var(--line);
             border-radius:6px; padding:4px 6px; font-size:12px; text-align:center;
             min-width:46px; height:fit-content}
  .task-time .h{font-size:18px; font-weight:700; line-height:1}
  .task-time .m{font-size:10px; color:var(--sub); margin-top:1px}
  .task-body{flex:1; min-width:0}
  .task-title{font-weight:700; font-size:15px; display:flex; gap:5px; align-items:center; flex-wrap:wrap}
  .task-meta{font-size:12px; color:var(--sub); margin-top:3px}

  /* 芯片 */
  .chip{display:inline-block; font-size:10px; border:1px solid var(--line);
        border-radius:4px; padding:1px 5px; margin-right:2px; color:var(--sub)}
  .chip.hi{color:var(--red); border-color:var(--red)}
  .chip.mid{color:var(--gold); border-color:var(--gold)}
  .chip.evid{color:var(--blue); border-color:var(--blue)}
  .chip.mand{color:var(--red); border-color:var(--red); font-weight:700}

  /* 按钮 */
  button{background:var(--light); color:#0f380f; border:0; border-radius:8px;
         padding:9px 14px; font-size:14px; font-weight:700; cursor:pointer;
         font-family:inherit}
  button.ghost{background:var(--panel2); color:var(--sub); border:1px solid var(--line); font-weight:400}
  button.danger{background:transparent; color:var(--red); border:1px solid var(--red); font-weight:400}
  button.primary{background:var(--light); color:#0f380f; font-weight:700; box-shadow:0 0 0 2px var(--line)}
  button.lg{padding:12px 20px; font-size:15px}
  button:disabled{opacity:.5; cursor:not-allowed}
  button.full{width:100%}

  input,select,textarea{background:var(--panel2); border:1px solid var(--line); color:var(--ink);
        border-radius:8px; padding:8px 10px; font-size:14px; width:100%; outline:none;
        font-family:inherit}
  input:focus,select:focus,textarea:focus{border-color:var(--light)}
  label{font-size:12px; color:var(--sub); display:block; margin:6px 0 2px}

  /* FAB 浮动按钮 */
  .fab{position:fixed; right:20px; bottom:78px;
       width:54px; height:54px; border-radius:50%;
       background:var(--light); color:#0f380f; font-size:26px; font-weight:700;
       border:0; box-shadow:0 4px 12px rgba(0,0,0,.5); z-index:5; cursor:pointer;
       display:none; line-height:54px; text-align:center}

  /* 标签页 */
  .tab{display:none}
  .tab.active{display:block}

  /* 底部导航 */
  .navbar{position:fixed; bottom:0; left:0; right:0; background:var(--panel);
          border-top:1px solid var(--line); display:none; max-width:560px; margin:0 auto;
          z-index:10}
  .navbar button{flex:1; background:none; color:var(--sub); border-radius:0; padding:9px 0;
                 font-size:11px; position:relative; font-weight:400}
  .navbar button.on{color:var(--ink); font-weight:700}
  .navbar button.on::before{content:""; position:absolute; top:0; left:30%; right:30%;
                            height:2px; background:var(--light)}
  .badge{position:absolute; top:2px; right:calc(50% - 20px);
         background:var(--red); color:#fff; border-radius:8px; font-size:9px;
         padding:1px 5px; min-width:14px; text-align:center; font-weight:700}

  /* 弹窗（底部弹出） */
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.7);
            z-index:100; display:none; align-items:flex-end; justify-content:center}
  .modal-bg.active{display:flex}
  .modal{background:var(--bg); border:1px solid var(--line); border-radius:14px 14px 0 0;
          width:100%; max-width:560px; max-height:90vh; overflow-y:auto;
          padding:14px 14px 24px; animation:slideUp .25s ease-out;
          color:var(--ink)}
  @keyframes slideUp{from{transform:translateY(100%)} to{transform:translateY(0)}}
  .modal-handle{width:36px; height:4px; background:var(--line); border-radius:2px;
                margin:0 auto 10px}
  .modal-title{font-size:16px; font-weight:700; margin-bottom:10px}
  .modal-actions{display:flex; gap:8px; margin-top:14px}
  .modal-actions button{flex:1; padding:11px; font-size:14px}

  /* 二次确认 */
  .confirm-bg{position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:200;
              display:none; align-items:center; justify-content:center; padding:20px}
  .confirm-bg.active{display:flex}
  .confirm-box{background:var(--panel); border:1px solid var(--line); border-radius:12px;
               padding:18px; max-width:340px; width:100%}
  .confirm-box h3{margin:0 0 8px; font-size:16px}
  .confirm-box p{margin:6px 0 14px; color:var(--sub); font-size:13px; line-height:1.5}
  .confirm-box .row{display:flex; gap:8px}
  .confirm-box .row button{flex:1}

  /* Days 选择 */
  .days label{display:inline-flex; align-items:center; margin:2px 4px 2px 0; font-size:12px; color:var(--ink)}
  .days input{width:auto; margin-right:3px}

  /* 模板卡 */
  .tmpl{background:var(--panel2); border:1px solid var(--line); border-radius:8px;
        padding:10px; margin-top:6px}
  .tmpl .tname{font-weight:700; color:var(--gold); font-size:14px}
  .tmpl .tmeta{font-size:12px; color:var(--sub); margin-top:3px}
  .tmpl .row{display:flex; gap:6px; margin-top:8px}
  .tmpl .row button{padding:7px 12px; font-size:12px; flex:1; min-width:80px}

  /* 申诉卡 */
  .appeal{border:1px solid var(--line); border-radius:8px; padding:10px; margin-top:6px}
  .appeal.pending{border-color:var(--gold)}
  .appeal-row{display:flex; gap:6px; margin-top:8px}
  .appeal-row button{flex:1; padding:8px; font-size:13px}

  /* Toast */
  #toast{position:fixed; left:50%; bottom:76px; transform:translateX(-50%);
         background:var(--panel2); border:1px solid var(--line); color:var(--ink);
         padding:10px 16px; border-radius:8px; display:none; z-index:9; max-width:90vw;
         font-size:13px}

  /* 战况事件 */
  .ev{border-left:3px solid var(--line); padding:6px 10px; margin-top:5px;
      font-size:13px; background:var(--panel2); border-radius:0 6px 6px 0}
  .ev.done{border-color:var(--light)}
  .ev.overdue{border-color:var(--red)}
  .ev.mission{border-color:var(--gold)}
  .ev.evid{border-color:var(--blue)}
  .ev .ts{color:var(--sub); font-size:11px; margin-right:4px}

  /* 工具类 */
  .flex{display:flex; gap:8px; align-items:center}
  .flex-1{flex:1}
  .dim{color:var(--sub); font-size:12px}
  .empty{text-align:center; padding:30px 14px; color:var(--sub)}
  .empty .icon{font-size:36px; margin-bottom:6px}

  .filter-bar{display:flex; gap:4px; margin-bottom:8px}
  .filter-bar button{padding:6px 8px; font-size:12px; flex:1; font-weight:400;
                     background:var(--panel2); color:var(--sub); border:1px solid var(--line);
                     border-radius:6px}
  .filter-bar button.on{background:var(--light); color:#0f380f; font-weight:700; border-color:var(--light)}

  ::-webkit-scrollbar{width:4px; height:4px}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:2px}
</style>
</head>
<body>

<!-- ════ 顶栏 ════ -->
<div class="topbar" id="topbar">
  <h1>🎖 锐察队长</h1>
  <span class="fam-chip" id="famLabel"></span>
  <span class="dev-chip" id="devStatus"><span class="dot"></span>无设备</span>
  <button class="ghost" style="padding:3px 8px;font-size:11px" onclick="logout()">退出</button>
</div>

<!-- ════ Toast ════ -->
<div id="toast"></div>

<!-- ════ FAB ════ -->
<button class="fab" id="fab" onclick="openTaskModal()" title="新增军令">＋</button>

<div class="wrap">

<!-- ════ 未登录 ════ -->
<div id="authView">
  <h1 style="margin-top:60px">🎖 锐察队长 · 家长指挥台</h1>
  <div class="dim">任务下发 · 实时战况 · 申诉审核</div>
  <div class="card">
    <label>家庭码</label>
    <input id="familyCode" placeholder="注册后生成">
    <label>家长密码</label>
    <input id="password" type="password" placeholder="至少 6 位">
    <div class="flex" style="margin-top:14px">
      <button onclick="login()" class="flex-1">登录</button>
      <button class="ghost" onclick="register()">注册新家庭</button>
    </div>
    <div class="dim" style="margin-top:14px">
      首次使用：点「注册新家庭」→ 记下家庭码 → 在孩子端 App 家长模式·同步页完成配对。
    </div>
  </div>
</div>

<!-- ════ 已登录 ════ -->
<div id="mainView" style="display:none">
  <div class="stats" id="stats">
    <div class="stat ok"><div class="v" id="statActive">-</div><div class="l">今日军令</div></div>
    <div class="stat warn"><div class="v" id="statPending">-</div><div class="l">待处理申诉</div></div>
    <div class="stat"><div class="v" id="statDone">-</div><div class="l">设备状态</div></div>
  </div>

  <!-- Tab 1: 今日 -->
  <div id="taskTab" class="tab active">
    <div class="card">
      <div class="card-title">📋 今日军令<span class="sp"></span><span class="dim" id="todayDate"></span></div>
      <div id="todayList"></div>
    </div>
  </div>

  <!-- Tab 2: 模板 -->
  <div id="tmplTab" class="tab">
    <div class="card">
      <div class="card-title">📚 任务模板<span class="sp"></span><span class="act" onclick="openTmplModal()">＋ 新建模板</span></div>
      <div class="dim" style="margin-bottom:8px">保存常用任务，一键下发到设备</div>
      <div id="tmplList"></div>
    </div>
  </div>

  <!-- Tab 3: 申诉 -->
  <div id="appealTab" class="tab">
    <div class="card">
      <div class="card-title">⚖️ 申诉审核<span class="sp"></span></div>
      <div class="filter-bar">
        <button class="on" id="appealFilterPending" onclick="loadAppeals('PENDING')">待处理</button>
        <button id="appealFilterAll" onclick="loadAppeals('')">全部</button>
      </div>
      <div id="appealList"></div>
    </div>
  </div>

  <!-- Tab 4: 战况 -->
  <div id="feedTab" class="tab">
    <div class="card">
      <div class="card-title">📡 实时战况<span class="sp"></span>
        <span class="dim" id="feedCount" style="font-size:12px"></span>
      </div>
      <div class="filter-bar">
        <button class="on" id="feedFilterAll" onclick="setFeedFilter('all')">全部</button>
        <button id="feedFilterCompletion" onclick="setFeedFilter('completion')">打卡</button>
        <button id="feedFilterMission" onclick="setFeedFilter('mission')">对局</button>
        <button id="feedFilterAppeal" onclick="setFeedFilter('appeal')">申诉</button>
      </div>
      <div id="feed"></div>
    </div>
  </div>
</div>
</div>

<!-- ════ 底部导航 ════ -->
<div class="navbar" id="navbar">
  <button id="navTask" class="on" onclick="switchTab('task')">📋 今日</button>
  <button id="navTmpl" onclick="switchTab('tmpl')">📚 模板</button>
  <button id="navAppeal" onclick="switchTab('appeal')">⚖️ 申诉<span class="badge" id="appealBadge" style="display:none">0</span></button>
  <button id="navFeed" onclick="switchTab('feed')">📡 战况</button>
</div>

<!-- ════ 新增军令弹窗 ════ -->
<div class="modal-bg" id="taskModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="taskModalTitle">➕ 新增军令</div>
    <label>任务标题</label>
    <input id="tTitle" placeholder="例：数学作业">
    <div class="flex" style="gap:8px">
      <div class="flex-1">
        <label>到点时间</label>
        <input id="tTime" type="time" value="19:00">
      </div>
      <div class="flex-1">
        <label>优先级</label>
        <select id="tPrio">
          <option value="HIGH">🔴 高（强制）</option>
          <option value="MED" selected>🟡 中</option>
          <option value="LOW">🟢 低（打卡）</option>
        </select>
      </div>
    </div>
    <label>生效日</label>
    <div class="days" id="tDays"></div>
    <div class="flex" style="gap:6px">
      <div class="flex-1">
        <label>完成功绩 +</label>
        <input id="tMeritR" type="number" value="10">
      </div>
      <div class="flex-1">
        <label>逾期功绩 −</label>
        <input id="tMeritP" type="number" value="20">
      </div>
      <div class="flex-1">
        <label>完成纲纪 +</label>
        <input id="tPointsR" type="number" value="5">
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-top:10px">
      <input id="tEvidence" type="checkbox" style="width:auto">
      📷 需拍照打卡（孩子完成时必须拍照取证）
    </label>
    <div class="modal-actions">
      <button class="ghost" onclick="closeTaskModal()">取消</button>
      <button class="ghost" onclick="saveAsTemplateFromModal()">💾 存模板</button>
      <button class="primary" onclick="dispatchFromModal()">🚀 下发</button>
    </div>
  </div>
</div>

<!-- ════ 模板编辑弹窗 ════ -->
<div class="modal-bg" id="tmplModal">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="tmplModalTitle">📚 新建模板</div>
    <label>模板名称</label>
    <input id="tmplName" placeholder="例：数学日常、练琴模板">
    <label>任务标题</label>
    <input id="tmplTitle" placeholder="例：数学作业">
    <div class="flex" style="gap:8px">
      <div class="flex-1">
        <label>到点时间</label>
        <input id="tmplTime" type="time" value="19:00">
      </div>
      <div class="flex-1">
        <label>优先级</label>
        <select id="tmplPrio">
          <option value="HIGH">🔴 高（强制）</option>
          <option value="MED" selected>🟡 中</option>
          <option value="LOW">🟢 低（打卡）</option>
        </select>
      </div>
    </div>
    <label>生效日</label>
    <div class="days" id="tmplDays"></div>
    <div class="flex" style="gap:6px">
      <div class="flex-1">
        <label>完成功绩 +</label>
        <input id="tmplMeritR" type="number" value="10">
      </div>
      <div class="flex-1">
        <label>逾期功绩 −</label>
        <input id="tmplMeritP" type="number" value="20">
      </div>
    </div>
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer;margin-top:10px">
      <input id="tmplEvidence" type="checkbox" style="width:auto">
      📷 需拍照打卡
    </label>
    <div class="modal-actions">
      <button class="ghost" onclick="closeTmplModal()">取消</button>
      <button class="primary" onclick="saveTemplate()">保存模板</button>
    </div>
  </div>
</div>

<!-- ════ 二次确认 ════ -->
<div class="confirm-bg" id="confirmModal">
  <div class="confirm-box">
    <h3 id="confirmTitle">确认？</h3>
    <p id="confirmDesc"></p>
    <div class="row">
      <button class="ghost" onclick="closeConfirm()">取消</button>
      <button class="primary" id="confirmOk">确认</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 状态
// ============================================================
const API = "";
let parentToken = localStorage.getItem("rc_parent_token") || "";
let famCode = localStorage.getItem("rc_fam") || "";
let activeTasks = [];
let templates = [];
let pendingAppealCount = 0;
let feedFilter = 'all';
let allEvents = [];        // 战况缓冲
let ws = null, hbTimer = null;
let confirmCallback = null;

const $ = id => document.getElementById(id);
const toast = m => {
  const t = $("toast");
  t.textContent = m;
  t.style.display = "block";
  clearTimeout(t._h);
  t._h = setTimeout(() => t.style.display = "none", 2400);
};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const DAYS = ["一","二","三","四","五","六","日"];
const newTaskId = () => (crypto.randomUUID ? crypto.randomUUID() :
  Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const prioName = p => ({HIGH:"高",MED:"中",LOW:"低"}[p] || p);
const prioClass = p => ({HIGH:"hi",MED:"mid",LOW:""}[p] || "");
function maskName(m){
  if(!m || m===127 || m===0) return "每天";
  return DAYS.filter((_,i)=>(m>>i)&1).map(d=>"周"+d).join(" ");
}

// ============================================================
// API 包装
// ============================================================
function authHeaders(){ return {"Authorization":"Bearer "+parentToken, "Content-Type":"application/json"}; }

async function api(path, opt={}){
  try {
    const r = await fetch(API+path, {...opt, headers:{...authHeaders(), ...(opt.headers||{})}});
    if(r.status===401){ logout(true); throw new Error("登录已过期"); }
    const j = await r.json();
    if(!r.ok) throw new Error(j.detail || ("HTTP "+r.status));
    return j;
  } catch(e){
    if(!parentToken) throw e;
    const r2 = await fetch(API+path, {...opt, headers:{...authHeaders(), ...(opt.headers||{})}});
    if(r2.status===401){ logout(true); throw new Error("登录已过期"); }
    if(!r2.ok){ const j2=await r2.json(); throw new Error(j2.detail||("HTTP "+r2.status)); }
    return r2.json();
  }
}

async function register(){
  const pw = $("password").value.trim();
  if(pw.length<6) return toast("密码至少 6 位");
  try{
    const r = await fetch(API+"/api/family/register",{
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({password: pw})});
    const j = await r.json();
    if(!r.ok) return toast(j.detail || "注册失败");
    $("familyCode").value = j.family_code;
    toast("家庭已创建：" + j.family_code + "（已填入，点登录）");
  }catch(e){ toast(e.message); }
}

async function login(){
  famCode = $("familyCode").value.trim();
  const pw = $("password").value.trim();
  if(!famCode || !pw) return toast("请填家庭码和密码");
  try{
    const r = await fetch(API+"/api/parent/login",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({family_code:famCode, password:pw})});
    const j = await r.json();
    if(!j.parent_token) throw new Error(j.detail || "登录失败");
    parentToken = j.parent_token;
    localStorage.setItem("rc_parent_token", parentToken);
    localStorage.setItem("rc_fam", famCode);
    enterMain();
  }catch(e){ toast(e.message); }
}

function logout(silent){
  parentToken = ""; famCode = "";
  localStorage.removeItem("rc_parent_token");
  localStorage.removeItem("rc_fam");
  if(ws){ ws.close(); ws = null; }
  $("mainView").style.display = "none";
  $("navbar").style.display = "none";
  $("topbar").style.display = "none";
  $("fab").style.display = "none";
  $("authView").style.display = "block";
  clearInterval(hbTimer);
  if(!silent) toast("已退出");
}

function enterMain(){
  $("authView").style.display = "none";
  $("mainView").style.display = "block";
  $("navbar").style.display = "flex";
  $("topbar").style.display = "flex";
  $("fab").style.display = "block";
  $("famLabel").textContent = "家庭 " + famCode;
  initDayBoxes();
  refreshAll();
  connectWS();
  clearInterval(hbTimer);
  hbTimer = setInterval(() => {
    refreshStatus();
    if($("appealTab").classList.contains("active")) loadAppeals("PENDING");
  }, 15000);
}

function switchTab(t){
  document.querySelectorAll(".tab").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".navbar button").forEach(el => el.className = "");
  $("taskTab").classList.toggle("active", t==="task");
  $("tmplTab").classList.toggle("active", t==="tmpl");
  $("appealTab").classList.toggle("active", t==="appeal");
  $("feedTab").classList.toggle("active", t==="feed");
  $("navTask").className = t==="task" ? "on" : "";
  $("navTmpl").className = t==="tmpl" ? "on" : "";
  $("navAppeal").className = t==="appeal" ? "on" : "";
  $("navFeed").className = t==="feed" ? "on" : "";
  if(t==="tmpl") loadTemplates();
  if(t==="appeal") loadAppeals("PENDING");
  if(t==="feed") renderFeed();
  // FAB 只在「今日」页显示
  $("fab").style.display = (t==="task") ? "block" : "none";
}

async function refreshAll(){
  await Promise.all([loadTasks(), loadTemplates(), refreshStatus()]);
}

// ============================================================
// Days 选择
// ============================================================
function initDayBoxes(){
  $("tDays").innerHTML = DAYS.map((d,i) =>
    `<label><input type="checkbox" value="${i}" ${i<5?"checked":""}>周${d}</label>`).join("");
  $("tmplDays").innerHTML = DAYS.map((d,i) =>
    `<label><input type="checkbox" value="${i}" ${i<5?"checked":""}>周${d}</label>`).join("");
}

// ============================================================
// 任务单（今日）—— 首页
// ============================================================
function readTaskForm(prefix){
  const days = [...$(prefix+"Days").querySelectorAll("input:checked")].map(i => +i.value);
  let mask = 0; days.forEach(d => mask |= 1<<d);
  if(!mask) mask = 127;
  return {
    task_id: newTaskId(),
    title: $(prefix+"Title").value.trim(),
    due_time: $(prefix+"Time").value || "19:00",
    days_mask: mask,
    priority: $(prefix+"Prio").value,
    mandatory: $(prefix+"Prio").value==="HIGH",
    merit_reward: +$(prefix+"MeritR").value || 0,
    merit_penalty: +$(prefix+"MeritP").value || 0,
    points_reward: +$(prefix+"PointsR").value || 0,
    points_penalty: $(prefix+"Prio").value==="HIGH" ? 10 : 0,
    require_evidence: !!$(prefix+"Evidence").checked,
    active: true
  };
}

function setTaskForm(prefix, t){
  $(prefix+"Title").value = t.title || "";
  $(prefix+"Time").value = t.due_time || "19:00";
  $(prefix+"Prio").value = t.priority || "MED";
  $(prefix+"MeritR").value = t.merit_reward || 0;
  $(prefix+"MeritP").value = t.merit_penalty || 0;
  $(prefix+"PointsR").value = t.points_reward || 0;
  $(prefix+"Evidence").checked = !!t.require_evidence;
  const mask = t.days_mask || 127;
  $(prefix+"Days").querySelectorAll("input").forEach((cb, i) => {
    cb.checked = (mask >> i) & 1;
  });
}

function clearTaskForm(prefix){
  $(prefix+"Title").value = "";
  $(prefix+"Time").value = "19:00";
  $(prefix+"Prio").value = "MED";
  $(prefix+"MeritR").value = 10;
  $(prefix+"MeritP").value = 20;
  $(prefix+"PointsR").value = 5;
  $(prefix+"Evidence").checked = false;
  $(prefix+"Days").querySelectorAll("input").forEach((cb, i) => { cb.checked = i<5; });
}

async function loadTasks(){
  try{
    const j = await api("/api/parent/tasks");
    activeTasks = j.tasks || [];
    renderToday();
  }catch(e){ toast(e.message); }
}

function renderToday(){
  const today = new Date();
  const weekday = (today.getDay() + 6) % 7;  // 周一=0 ... 周日=6
  $("todayDate").textContent = `${today.getMonth()+1}月${today.getDate()}日 周${DAYS[weekday]}`;

  const todays = activeTasks
    .filter(t => (t.days_mask >> weekday) & 1)
    .sort((a,b) => (a.due_time||"").localeCompare(b.due_time||""));

  $("statActive").textContent = todays.length;

  if(!todays.length){
    $("todayList").innerHTML = `
      <div class="empty">
        <div class="icon">📋</div>
        <div>今天还没有军令</div>
        <button class="primary lg" style="margin-top:14px" onclick="openTaskModal()">＋ 新增第一个军令</button>
      </div>`;
    return;
  }

  $("todayList").innerHTML = todays.map(t => {
    const [hh, mm] = (t.due_time||"19:00").split(":");
    return `
      <div class="task">
        <div class="task-time">
          <div class="h">${hh}</div><div class="m">:${mm}</div>
        </div>
        <div class="task-body">
          <div class="task-title">
            <span>${esc(t.title)}</span>
            <span class="chip ${prioClass(t.priority)}">${prioName(t.priority)}</span>
            ${t.mandatory?'<span class="chip mand">强制</span>':''}
            ${t.require_evidence?'<span class="chip evid">📷拍照</span>':''}
          </div>
          <div class="task-meta">${maskName(t.days_mask)} · 功绩+${t.merit_reward}${t.merit_penalty?"/逾期-"+t.merit_penalty:""}</div>
        </div>
      </div>`;
  }).join("");
}

// ============================================================
// 弹窗：新增/编辑军令
// ============================================================
function openTaskModal(){
  clearTaskForm("t");
  $("taskModalTitle").textContent = "➕ 新增军令";
  $("taskModal").classList.add("active");
}
function closeTaskModal(){ $("taskModal").classList.remove("active"); }
$("taskModal").addEventListener("click", e => {
  if(e.target === $("taskModal")) closeTaskModal();
});

function dispatchFromModal(){
  const t = readTaskForm("t");
  if(!t.title) return toast("任务标题不能为空");

  const evidenceNote = t.require_evidence ? "，并要求拍照取证" : "";
  showConfirm("确认下发此军令？",
    `「${t.title}」将在 ${t.due_time} 推送给孩子设备${evidenceNote}。`,
    async () => {
      try{
        // 追加到现有任务列表
        const merged = [...activeTasks.filter(x => x.active !== false), t];
        await api("/api/parent/tasks", {
          method:"POST",
          body: JSON.stringify({tasks: merged})
        });
        toast("✅ 已下发");
        closeTaskModal();
        await loadTasks();
        refreshStatus();
      }catch(e){ toast(e.message); }
    }
  );
}

function saveAsTemplateFromModal(){
  const t = readTaskForm("t");
  if(!t.title) return toast("任务标题不能为空");
  $("tmplName").value = t.title + "模板";
  $("tmplTitle").value = t.title;
  $("tmplTime").value = t.due_time;
  $("tmplPrio").value = t.priority;
  $("tmplMeritR").value = t.merit_reward;
  $("tmplMeritP").value = t.merit_penalty;
  $("tmplEvidence").checked = t.require_evidence;
  const mask = t.days_mask || 127;
  $("tmplDays").querySelectorAll("input").forEach((cb, i) => {
    cb.checked = (mask >> i) & 1;
  });
  $("tmplModalTitle").textContent = "📚 存为模板";
  closeTaskModal();
  $("tmplModal").classList.add("active");
}

// ============================================================
// 二次确认
// ============================================================
function showConfirm(title, desc, onOk){
  $("confirmTitle").textContent = title;
  $("confirmDesc").textContent = desc;
  confirmCallback = onOk;
  $("confirmOk").onclick = () => { closeConfirm(); if(confirmCallback) confirmCallback(); };
  $("confirmModal").classList.add("active");
}
function closeConfirm(){
  $("confirmModal").classList.remove("active");
  confirmCallback = null;
}
$("confirmModal").addEventListener("click", e => {
  if(e.target === $("confirmModal")) closeConfirm();
});

// ============================================================
// 模板
// ============================================================
async function loadTemplates(){
  try{
    const j = await api("/api/templates");
    templates = j.templates || [];
    renderTemplates();
  }catch(e){ toast(e.message); }
}

function openTmplModal(){
  $("tmplModalTitle").textContent = "📚 新建模板";
  $("tmplName").value = "";
  $("tmplTitle").value = "";
  $("tmplTime").value = "19:00";
  $("tmplPrio").value = "MED";
  $("tmplMeritR").value = 10;
  $("tmplMeritP").value = 20;
  $("tmplEvidence").checked = false;
  $("tmplDays").querySelectorAll("input").forEach((cb, i) => cb.checked = i<5);
  $("tmplModal").classList.add("active");
}
function closeTmplModal(){ $("tmplModal").classList.remove("active"); }
$("tmplModal").addEventListener("click", e => {
  if(e.target === $("tmplModal")) closeTmplModal();
});

async function saveTemplate(){
  const name = $("tmplName").value.trim();
  if(!name) return toast("模板名称不能为空");
  const days = [...$("tmplDays").querySelectorAll("input:checked")].map(i => +i.value);
  let mask = 0; days.forEach(d => mask |= 1<<d);
  if(!mask) mask = 127;
  try{
    await api("/api/templates", {
      method:"POST",
      body: JSON.stringify({
        template_id: "",
        name: name,
        title: $("tmplTitle").value.trim() || name,
        due_time: $("tmplTime").value || "19:00",
        days_mask: mask,
        priority: $("tmplPrio").value,
        mandatory: $("tmplPrio").value==="HIGH",
        merit_reward: +$("tmplMeritR").value || 0,
        merit_penalty: +$("tmplMeritP").value || 0,
        points_reward: 5,
        points_penalty: $("tmplPrio").value==="HIGH" ? 10 : 0,
        require_evidence: $("tmplEvidence").checked
      })
    });
    toast("✅ 模板已保存");
    closeTmplModal();
    await loadTemplates();
  }catch(e){ toast(e.message); }
}

function renderTemplates(){
  if(!templates.length){
    $("tmplList").innerHTML = '<div class="empty"><div class="icon">📚</div><div>暂无模板</div><div class="dim" style="margin-top:4px">在「今日」页填写任务后点「存模板」保存</div></div>';
    return;
  }
  $("tmplList").innerHTML = templates.map(t => `
    <div class="tmpl">
      <div class="tname">${esc(t.name)}</div>
      <div class="tmeta">「${esc(t.title)}」 ${t.due_time} · ${maskName(t.days_mask)} ·
        <span class="chip ${prioClass(t.priority)}">${prioName(t.priority)}</span>
        ${t.mandatory?'<span class="chip mand">强制</span>':''}
        ${t.require_evidence?'<span class="chip evid">📷拍照</span>':''}
        · 功绩+${t.merit_reward}${t.merit_penalty?"/逾期-"+t.merit_penalty:""}
      </div>
      <div class="row">
        <button onclick="useTemplate('${t.template_id}')">🚀 立即下发</button>
        <button class="ghost" onclick="deleteTemplate('${t.template_id}')">🗑 删除</button>
      </div>
    </div>`).join("");
}

async function useTemplate(templateId){
  const t = templates.find(x => x.template_id === templateId);
  if(!t) return;
  showConfirm("确认下发此模板？",
    `「${t.name}」→ ${t.title}（${t.due_time}）将下发到设备。`,
    async () => {
      try{
        await api(`/api/templates/${templateId}/dispatch`, {method:"POST"});
        toast("✅ 已下发到设备");
        await loadTasks();
        refreshStatus();
      }catch(e){ toast(e.message); }
    }
  );
}

async function deleteTemplate(templateId){
  showConfirm("确认删除模板？", "删除后无法恢复。", async () => {
    try{
      await api(`/api/templates/${templateId}`, {method:"DELETE"});
      toast("已删除");
      await loadTemplates();
    }catch(e){ toast(e.message); }
  });
}

// ============================================================
// 申诉
// ============================================================
async function loadAppeals(status){
  try{
    const j = await api("/api/appeals" + (status ? "?status="+status : ""));
    renderAppeals(j.appeals || []);
    // 切换过滤按钮高亮
    $("appealFilterPending").classList.toggle("on", !!status);
    $("appealFilterAll").classList.toggle("on", !status);
    if(!status || status==="PENDING"){
      pendingAppealCount = (j.appeals || []).filter(a => a.result==="PENDING").length;
      updateAppealBadge();
    }
  }catch(e){ toast(e.message); }
}

function updateAppealBadge(){
  const badge = $("appealBadge");
  if(pendingAppealCount > 0){
    badge.textContent = pendingAppealCount;
    badge.style.display = "inline-block";
  } else {
    badge.style.display = "none";
  }
}

async function reviewAppeal(sessionId, result){
  showConfirm(result==="APPROVED" ? "通过此申诉？" : "驳回此申诉？",
    result==="APPROVED" ? "孩子的处分将被撤销" : "孩子的处分将保持",
    async () => {
      try{
        await api(`/api/appeals/${sessionId}/review`, {
          method:"POST",
          body: JSON.stringify({result})
        });
        toast(result==="APPROVED" ? "✅ 已通过申诉" : "已驳回申诉");
        await loadAppeals("PENDING");
        refreshStatus();
      }catch(e){ toast(e.message); }
    }
  );
}

function resultLabel(r){ return {PENDING:"⏳ 待处理", APPROVED:"✅ 已通过", REJECTED:"❌ 已驳回"}[r]||r; }
function resultClass(r){ return {PENDING:"pending", APPROVED:"approved", REJECTED:"rejected"}[r]||""; }

function renderAppeals(appeals){
  if(!appeals.length){
    $("appealList").innerHTML = '<div class="empty"><div class="icon">⚖️</div><div>暂无申诉</div></div>';
    return;
  }
  $("appealList").innerHTML = appeals.map(a => `
    <div class="appeal ${resultClass(a.result)}">
      <div class="flex" style="margin-bottom:4px">
        <b>第 ${a.session_id} 局</b>
        <span class="sp" style="flex:1"></span>
        <span class="chip ${a.result==='PENDING'?'mand':''}">${resultLabel(a.result)}</span>
      </div>
      <div class="dim" style="font-size:12px">
        ${a.device_name} · ${a.submitted_at ? new Date(a.submitted_at).toLocaleString() : ""}
        ${a.reviewed_at ? ' · 审核：'+new Date(a.reviewed_at).toLocaleString() : ""}
      </div>
      ${a.reason ? `<div style="margin-top:6px;font-size:13px">申诉理由：${esc(a.reason)}</div>` : ""}
      ${a.has_evidence ? `<div style="margin-top:6px">
        <button onclick="showAppealEvidence(${JSON.stringify(a.evidence_ids||[]).replace(/"/g,'&quot;')})"
          style="padding:4px 10px;font-size:12px">📷 查看凭证(${a.evidence_ids ? a.evidence_ids.length : 0}张)</button>
      </div>` : ""}
      ${a.result === "PENDING" ? `
        <div class="appeal-row">
          <button onclick="reviewAppeal('${a.session_id}','APPROVED')">✅ 通过</button>
          <button class="danger" onclick="reviewAppeal('${a.session_id}','REJECTED')">❌ 驳回</button>
        </div>` : ""}
    </div>`).join("");
}

async function showAppealEvidence(evIds){
  if(!evIds || !evIds.length){ toast("无凭证"); return; }
  const overlay = document.createElement("div");
  overlay.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column";
  overlay.onclick = e => { if(e.target === overlay) overlay.remove(); };
  const title = document.createElement("div");
  title.textContent = `申诉凭证`;
  title.style.cssText = "color:#fff;margin-bottom:12px;font-size:15px;font-weight:bold";
  overlay.appendChild(title);
  const container = document.createElement("div");
  container.style.cssText = "display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:90vw;max-height:70vh;overflow-y:auto";
  overlay.appendChild(container);
  document.body.appendChild(overlay);
  let ok = 0;
  for(const id of evIds){
    try{
      const r = await api(`/api/evidence/${id}`);
      const img = document.createElement("img");
      img.src = `data:${r.mime};base64,${r.data_b64}`;
      img.style.cssText = "max-width:320px;max-height:320px;border-radius:6px;border:2px solid #555;cursor:pointer";
      img.onclick = () => img.style.maxWidth === "320px" ? (img.style.maxWidth="100%") : (img.style.maxWidth="320px", img.style.maxHeight="320px");
      container.appendChild(img);
      ok++;
    }catch(_){}
  }
  if(!ok){ toast("加载凭证失败"); overlay.remove(); }
  const closeBtn = document.createElement("button");
  closeBtn.textContent = "关闭";
  closeBtn.style.cssText = "margin-top:12px;padding:6px 20px;background:#444;color:#fff;border-radius:4px;cursor:pointer";
  closeBtn.onclick = () => overlay.remove();
  overlay.appendChild(closeBtn);
}

// ============================================================
// 战况（实时事件流）
// ============================================================
const FEED_FILTERS = {
  all: ev => true,
  completion: ev => ev.kind === "task_completion",
  mission: ev => ev.kind === "mission_result",
  appeal: ev => ev.kind === "appeal_submitted"
};

function setFeedFilter(f){
  feedFilter = f;
  ["All","Completion","Mission","Appeal"].forEach(name => {
    const btn = $("feedFilter"+name);
    btn.classList.toggle("on", name.toLowerCase() === f || (f==="all" && name==="All"));
  });
  renderFeed();
}

function addFeed(ev){
  // ⚠️ 隐私：拍照任务的图片本身就不在事件流里，但题目要求"战况看不到需要拍照的任务详情"——
  // 战况只显示标题+状态，照片只能去「申诉」页查看凭证。
  allEvents.unshift(ev);
  if(allEvents.length > 100) allEvents.length = 100;
  $("feedCount").textContent = allEvents.length + " 条";
  if($("feedTab").classList.contains("active")) renderFeed();
}

function renderFeed(){
  const filtered = allEvents.filter(FEED_FILTERS[feedFilter] || (()=>true));
  $("feed").innerHTML = filtered.slice(0, 50).map(ev => {
    const cls = ev.kind === "task_completion" ? (ev.data.state==="DONE" ? "done" : "overdue")
              : ev.kind === "mission_result" ? "mission"
              : ev.kind === "appeal_submitted" ? "evid" : "";
    return `<div class="ev ${cls}">${ev.html}</div>`;
  }).join("") || '<div class="empty"><div class="icon">📡</div><div>暂无事件</div></div>';
}

function connectWS(){
  if(ws) ws.close();
  const proto = location.protocol==="https:"?"wss":"ws";
  ws = new WebSocket(`${proto}://${location.host}/ws/parent?token=${encodeURIComponent(parentToken)}`);
  ws.onmessage = e => {
    try{
      const m = JSON.parse(e.data);
      if(m.type==="device_status") renderDevStatus(m);
      else if(m.type==="event") renderEvent(m.event);
      else if(m.type==="events_backlog") (m.events||[]).slice().reverse().forEach(renderEvent);
    }catch(_){}
  };
  ws.onclose = () => { setTimeout(() => { if(parentToken) connectWS(); }, 5000); };
}

function renderEvent(ev){
  const t = ev.created_at ? new Date(ev.created_at).toLocaleTimeString() : "";
  // 战况不展示 task_id 等技术字段，拍照任务的图片也不展开
  if(ev.kind==="task_completion"){
    const ok = ev.data.state==="DONE";
    addFeed({
      kind: "task_completion",
      html: `<span class="ts">${t}</span>军令「${esc(ev.data.title || ev.data.task_id)}」 ${ok?"✅ 已完成":"❌ 逾期未完成"}`,
      data: ev.data
    });
  } else if(ev.kind==="mission_result"){
    const d = ev.data;
    const pd = d.pointsDelta ?? d.points_delta ?? 0;
    const md = d.meritDelta ?? d.merit_delta ?? 0;
    const vm = d.validMinutes ?? d.valid_minutes ?? 0;
    const oc = {COMPLETED:"幸存通关", EXECUTED:"军法处置", ABORTED:"中断", APPEAL_PENDING:"申诉中"}[d.outcome] || d.outcome;
    addFeed({
      kind: "mission_result",
      html: `<span class="ts">${t}</span>对局「${esc(d.task)}」 ${oc} · 纲纪 ${pd>=0?"+":""}${pd} · 功绩 ${md>=0?"+":""}${md} · 有效 ${vm} 分钟`,
      data: ev.data
    });
  } else if(ev.kind==="appeal_submitted"){
    addFeed({
      kind: "appeal_submitted",
      html: `<span class="ts">${t}</span>📋 孩子提交了申诉「第 ${esc(ev.data.session_id || ev.data.sessionId || '?')} 局」`,
      data: ev.data
    });
    pendingAppealCount++;
    updateAppealBadge();
  }
}

async function refreshStatus(){
  if(!parentToken) return;
  try{
    const j = await api("/api/status");
    renderDevStatus(j);
    if(j.pending_appeals !== undefined && j.pending_appeals !== pendingAppealCount){
      pendingAppealCount = j.pending_appeals;
      updateAppealBadge();
    }
    $("statPending").textContent = pendingAppealCount;
  }catch(_){}
}

function renderDevStatus(s){
  let online, name;
  if(s.devices){
    online = s.devices[0]?.online || false;
    name = s.devices[0]?.name || "无设备";
  } else {
    online = !!s.online;
    name = s.name || "无设备";
  }
  $("devStatus").innerHTML = `<span class="dot ${online?"on":""}"></span>${esc(name)}`;
  // 顶栏"设备状态"统计
  $("statDone").textContent = online ? "在线" : "离线";
  $("statDone").style.color = online ? "var(--light)" : "var(--red)";
}

// ============================================================
// 启动
// ============================================================
if(parentToken && famCode){
  $("familyCode").value = famCode;
  enterMain();
}
</script>
